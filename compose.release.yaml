# Pull-only deployment. Images are built by GitHub Actions, never on this server.
name: yidian-image
services:
  app:
    image: ${YIDIAN_IMAGE:?Set YIDIAN_IMAGE to the released GHCR digest or version}
    init: true
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /app/data
    expose:
      - "8787"
    networks:
      proxy:
        aliases:
          - yidian-image-web
    volumes:
      - studio-data:/app/data
    stop_grace_period: 240s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK to the existing Caddy network}
volumes:
  studio-data:

